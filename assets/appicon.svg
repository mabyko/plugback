<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Plugback 앱 아이콘 — 맥북(화면 + 하판 쐐기) 위에 겹쳐 놓인 창들, 앰버 1장이 앞.
       하판 쐐기는 hero.svg의 맥북과 같은 도형이다. 악센트는 전기 앰버 1색. -->
  <rect x="70" y="70" width="884" height="884" rx="200" fill="#26262A"/>
  <!-- 창 3장 — 뒤 회색 2장은 흰색 저투명도(겹침이 그대로 보인다), 앞 1장만 앰버 -->
  <rect x="608" y="363" width="178" height="162" rx="20" fill="#F5F5F7" opacity="0.16" transform="rotate(8 697 444)"/>
  <rect x="211" y="373" width="251" height="177" rx="22" fill="#F5A200" transform="rotate(-7 336 461)"/>
  <rect x="274" y="436" width="355" height="178" rx="22" fill="#F5F5F7" opacity="0.13" transform="rotate(-2 451 525)"/>
  <!-- 맥북: 화면 테두리 + 하판 -->
  <rect x="182" y="266" width="660" height="420" rx="40" stroke="#F5F5F7" stroke-width="26" fill="none"/>
  <!-- 노치 — 상단 베젤에서 내려온 탭 (맥북임을 밝히는 유일한 디테일) -->
  <path d="M450 266 h124 v20 a12 12 0 0 1 -12 12 h-100 a12 12 0 0 1 -12 -12 z" fill="#F5F5F7"/>
  <path d="M127 712 h770 l-47 46 h-676 z" fill="#F5F5F7" opacity="0.85"/>
</svg>
