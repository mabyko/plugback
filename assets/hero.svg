<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Plugback</title>
  <desc id="desc">외장 화면을 분리하면 대상 창이 맥북으로 내려옵니다. 다시 연결하면 Plugback이 그 창만 저장된 자리로 돌려놓고, 맥북에 있던 창은 그대로 둡니다.</desc>

  <!-- 팔레트: 시스템 중립색 + 전기 앰버 한 색. 평면·고대비·저밀도. -->

  <!-- 분리: 외장 화면은 비고, 대상 창만 맥북으로 내려온다. -->
  <rect x="62" y="38" width="250" height="150" rx="14" stroke="#6E6E73" stroke-width="4" stroke-dasharray="8 8" opacity="0.42"/>
  <path d="M172 194h30v10h-30z" fill="#6E6E73" opacity="0.35"/>
  <rect x="94" y="220" width="190" height="86" rx="10" stroke="#6E6E73" stroke-width="4"/>
  <path d="M171 220h36v4a4 4 0 0 1-4 4h-28a4 4 0 0 1-4-4z" fill="#6E6E73"/>
  <path d="M74 312h230l-14 12H88z" fill="#6E6E73" opacity="0.42"/>
  <rect x="118" y="270" width="82" height="25" rx="6" fill="#6E6E73" opacity="0.28"/>
  <rect x="142" y="238" width="106" height="48" rx="9" fill="#FFB000"/>

  <!-- 다시 연결 -->
  <path d="M376 172h112" stroke="#6E6E73" stroke-width="5" stroke-linecap="round"/>
  <path d="m466 151 23 21-23 21" stroke="#FFB000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 연결: 대상 창은 외장 화면의 저장된 자리, 맥북 창은 같은 자리. -->
  <rect x="558" y="38" width="250" height="150" rx="14" stroke="#6E6E73" stroke-width="4"/>
  <path d="M668 194h30v10h-30z" fill="#6E6E73" opacity="0.55"/>
  <rect x="574" y="54" width="110" height="118" rx="9" fill="#FFB000"/>
  <rect x="696" y="54" width="96" height="54" rx="9" fill="#6E6E73" opacity="0.32"/>
  <rect x="696" y="118" width="96" height="54" rx="9" fill="#6E6E73" opacity="0.22"/>
  <rect x="588" y="220" width="190" height="86" rx="10" stroke="#6E6E73" stroke-width="4"/>
  <path d="M665 220h36v4a4 4 0 0 1-4 4h-28a4 4 0 0 1-4-4z" fill="#6E6E73"/>
  <path d="M568 312h230l-14 12H582z" fill="#6E6E73" opacity="0.42"/>
  <rect x="612" y="270" width="82" height="25" rx="6" fill="#6E6E73" opacity="0.28"/>
</svg>
