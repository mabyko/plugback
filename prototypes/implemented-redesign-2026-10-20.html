<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plugback · 구현된 화면</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground,#252b27);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}p{margin:0;color:var(--muted-foreground,#66706b);word-break:keep-all}label{font-size:13px}select{display:block;font:inherit;color:inherit;background:var(--card,#fff);border:1px solid var(--border,#ccd2cd);border-radius:8px;padding:8px 12px;min-height:40px;width:100%;margin-top:6px}select:focus-visible{outline:3px solid #6f916f;outline-offset:3px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0 20px}.shots{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}figure{margin:0;min-width:0}figcaption{font-size:12px;color:var(--muted-foreground,#66706b);margin-bottom:10px}img{width:100%;height:auto;display:block}.note{font-size:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border,#ccd2cd)}@media(max-width:520px){.shots{grid-template-columns:1fr;gap:22px}.controls{grid-template-columns:1fr;gap:10px}}</style></head><body><main><p>실제 SwiftUI 구현 · 테스트 데이터로 렌더링했습니다.</p><div class="controls"><label>살펴볼 상태<select id="scene"><option value="waiting">Space 방문 대기</option><option value="first">첫 저장</option><option value="failure">저장 실패</option><option value="list">앱 목록</option></select></label><label>비교 화면<select id="compare"><option value="light">밝은 상태 카드</option><option value="settings">일반 설정</option><option value="spaces">Space 탐색</option></select></label></div><div class="shots"><figure><figcaption id="leftLabel">현재 작업과 다음 행동</figcaption><img id="left" src="../assets/layout-status.png" alt="Space 방문 대기 중인 Plugback 상태 카드"></figure><figure><figcaption id="rightLabel">밝은 상태 카드</figcaption><img id="right" src="../assets/redesign-status-light.png" alt="같은 상태의 밝은 카드"></figure></div><p class="note">화면은 이미지입니다. 실제 창 이동·화면 재연결·VoiceOver 검증은 실기기 체크리스트에 남겨 두었습니다.</p></main><script>
const scenes={waiting:['../assets/layout-status.png','현재 작업과 다음 행동'],first:['../assets/redesign-first-save.png','첫 작업 환경의 저장 안내'],failure:['../assets/redesign-failed-save.png','실패 안내와 이전 저장본 보존'],list:['../assets/layout-list.png','기존 빠른 목록 구성']};
const comparisons={light:['../assets/redesign-status-light.png','밝은 상태 카드'],settings:['../assets/redesign-settings-general.png','일반 설정이 먼저 열립니다'],spaces:['../assets/layout-spaces.png','Space 선택은 탐색만 바꿉니다']};
function change(control,image,label,options){const item=options[document.getElementById(control).value];document.getElementById(image).src=item[0];document.getElementById(image).alt=item[1];document.getElementById(label).textContent=item[1];}
document.getElementById('scene').addEventListener('change',()=>change('scene','left','leftLabel',scenes));
document.getElementById('compare').addEventListener('change',()=>change('compare','right','rightLabel',comparisons));
console.assert(Object.keys(scenes).length===4&&Object.keys(comparisons).length===3,'All native views available');
</script></body></html>
