const descriptions={A:{name:'상태 카드',short:'복원이 중심, 관리는 안쪽',body:'평소에는 준비 상태와 복원 버튼만 봅니다. 앱 목록은 관리 화면으로 들어가 확인합니다.',fit:'저장해 둔 배치를 주로 복원할 때',trade:'개별 앱을 바꾸려면 한 번 더 들어갑니다.'},B:{name:'빠른 목록',short:'바로 찾고, 바로 조절',body:'메뉴를 열면 대상 앱이 바로 보입니다. 행을 촘촘하게 줄이고 검색과 스크롤에 공간을 돌려줬습니다.',fit:'앱별 포함 여부를 자주 바꿀 때',trade:'앱이 많으면 세로 스크롤은 남습니다.'},C:{name:'Space 탐색',short:'작업 공간 단위로 보기',body:'긴 목록을 Space별로 나눕니다. 왼쪽에서 공간을 선택하면 그곳에 저장한 앱만 보입니다.',fit:'Space를 여러 개로 나누어 쓸 때',trade:'카드 폭이 넓고, Space 하나만 쓰면 이점이 작습니다.'},D:{name:'아이콘 보드',short:'스무 개를 한눈에',body:'앱 아이콘을 중심으로 한 화면에 더 많이 담았습니다. 체크박스로 포함 여부를 바로 바꿉니다.',fit:'앱을 아이콘으로 빠르게 구분할 때',trade:'이름이 긴 앱이나 비슷한 아이콘은 구분이 어렵습니다.'}};
const query=new URLSearchParams(location.search);
const state={variant:'ABCD'.includes(query.get('variant'))&&query.get('variant')?.length===1?query.get('variant'):'A',theme:query.get('theme')==='light'?'light':'dark',amount:query.get('apps')==='8'?8:20,scenario:['ready','guide','failure','offline'].includes(query.get('state'))?query.get('state'):'ready',compare:query.get('view')==='compare',manager:false,space:1,excluded:false,auto:true,enabled:new Set(apps.map(a=>a.id)),search:{A:'',B:'',D:''},removed:new Set(),expanded:new Set(),message:''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visible=()=>apps.slice(0,state.amount);
const tracked=()=>visible().filter(a=>state.enabled.has(a.id));
const omitted=()=>[...visible().filter(a=>!state.enabled.has(a.id)&&!state.removed.has(a.id)),...extras.filter(a=>!state.removed.has(a.id)&&!state.enabled.has(a.id))];
const chosen=()=>[...tracked(),...extras.filter(a=>state.enabled.has(a.id)&&!state.removed.has(a.id))];
const icon=a=>icons[a.name]?`<img class="appicon" src="${icons[a.name]}" alt="">`:`<span class="appicon fallback" aria-hidden="true">${esc(a.name[0])}</span>`;
const monitor='<svg class="monitor" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="5" width="26" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M12 28h8M16 23v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const source=()=>state.scenario==='guide'?'현재 배치를 저장하고 시작하세요':state.scenario==='offline'?'모니터를 연결하면 복원할 수 있어요':'자동 저장 · 오늘 오전 11:20';
const header=()=>`<div class="top">${monitor}<h2>LG HDR 4K</h2><span class="badge">${state.scenario==='offline'?'연결 안 됨':'연결됨'}</span></div>`;
const actions=()=>`<div class="actions"><button class="primary" data-action="restore" ${['offline','guide'].includes(state.scenario)||!chosen().length?'disabled':''}>↶ 지금 복원</button><button class="secondary" data-action="save" ${state.scenario==='offline'?'disabled':''}>${state.scenario==='guide'?'배치 저장':'저장'}</button></div>`;
const last=()=>state.scenario==='guide'?'':`<div class="last"><strong>↶ 마지막 복원</strong><span title="앱 8개를 대상으로 한 직전 복원 예시">${state.scenario==='failure'?'이동 5 · 실패 1':'이동 2 · 건너뜀 6'}</span><button data-action="details">상세 ›</button></div>`;
const footer=()=>`<div class="footer"><label><input class="toggle" type="checkbox" data-auto ${state.auto?'checked':''}>자동 복원</label><span class="spacer"></span><button data-action="settings">설정</button><button data-action="quit">종료</button></div>`;
const notice=()=>state.scenario==='failure'?'<div class="notice">Xcode 창을 옮기지 못했어요. 앱을 연 뒤 다시 복원해 주세요.</div>':'';
function row(a,excluded=false){return `<div class="row ${excluded?'offrow':''}"><label class="row" style="flex:1;min-width:0;padding:0"><input type="checkbox" data-app="${a.id}" ${state.enabled.has(a.id)?'checked':''} aria-label="${esc(a.name)} 복원 대상">${icon(a)}<span class="name" title="${esc(a.name)}">${esc(a.name)}</span></label>${!a.running?'<span class="status">꺼짐</span>':''}${excluded&&a.stored?`<button class="remove" data-remove="${a.id}" title="저장 기록 삭제" aria-label="${esc(a.name)} 저장 기록 삭제">×</button>`:''}</div>`}
function excludedList(v){const list=omitted();return list.length?`<details data-excluded="${v}" ${state.expanded.has(v)?'open':''}><summary>저장하지 않는 앱 <span>${list.length}</span></summary><div class="source" style="margin:0 0 5px">체크하면 포함 · ×는 저장 기록만 삭제</div>${list.map(a=>row(a,true)).join('')}</details>`:''}
const search=v=>`<input class="search" type="search" data-search="${v}" placeholder="앱 검색" aria-label="앱 검색" value="${esc(state.search[v])}">`;
const match=(a,v)=>a.name.toLocaleLowerCase().includes(state.search[v].trim().toLocaleLowerCase());
function listView(v){const list=chosen().filter(a=>match(a,v));return `<div class="toolbar">${search(v)}<span class="count">${chosen().length}개 대상</span></div><div class="scroll"><div class="list">${list.map(a=>row(a)).join('')||'<div class="empty">검색 결과가 없어요</div>'}</div>${excludedList(v)}</div>`}
function contents(v){if(v==='B')return `<div class="pad">${header()}${actions()}<p class="source">${source()}</p></div><div class="pad" style="padding-top:0">${listView(v)}</div>${notice()}${last()}${footer()}`;
if(v==='A')return state.manager?`<div class="pad"><div class="backbar"><button data-action="back" aria-label="상태 카드로 돌아가기">‹</button><h3>대상 앱 관리</h3></div>${listView(v)}<p class="source">변경한 선택은 바로 적용됩니다.</p></div>${footer()}`:`<div class="hero">${header()}${actions()}<p class="source">${source()}</p><div class="stack">${chosen().slice(0,6).map(icon).join('')}<span>${chosen().length}개 앱 · ${new Set(chosen().map(a=>a.space)).size}개 Space</span></div><button class="manage" data-action="manage"><span>대상 앱 관리 <span class="count">· ${chosen().length}개</span></span><span>›</span></button></div>${notice()}${last()}${footer()}`;
if(v==='C'){let list=state.space==='excluded'?omitted():chosen().filter(a=>a.space===state.space);return `<div class="pad">${header()}${actions()}<p class="source">전체 ${chosen().length}개 앱 복원 · ${source()}</p></div><div class="spacebody"><nav class="spaces" aria-label="저장된 Space">${[1,2,3].map(n=>`<button data-space="${n}" class="${state.space===n?'selected':''}">Space ${n}<span class="spacecount">${chosen().filter(a=>a.space===n).length}</span></button>`).join('')}<button data-space="excluded" class="excludedtab ${state.space==='excluded'?'selected':''}">제외 앱<span class="spacecount">${omitted().length}</span></button></nav><div class="spacelist"><div class="spaceheading"><strong>${state.space==='excluded'?'저장하지 않는 앱':'Space '+state.space}</strong><span>${list.length}개</span></div><div class="scroll">${list.map(a=>row(a,state.space==='excluded')).join('')||'<div class="empty">이 공간에는 대상 앱이 없어요</div>'}</div></div></div>${notice()}${last()}${footer()}`}
let list=(state.excluded?omitted():chosen()).filter(a=>match(a,'D'));return `<div class="pad">${header()}${actions()}<p class="source">${source()}</p></div><div class="pad" style="padding-top:0"><div class="toolbar">${search('D')}<button data-action="filter" class="filter ${state.excluded?'selected':''}">제외 ${omitted().length}</button></div><div class="scroll gridscroll">${list.length?`<div class="grid">${list.map(a=>`<label class="tile ${state.enabled.has(a.id)?'':'offrow'}" title="${esc(a.name)}${a.running?'':' · 꺼짐'}"><input type="checkbox" data-app="${a.id}" ${state.enabled.has(a.id)?'checked':''} aria-label="${esc(a.name)} 복원 대상">${icon(a)}<span class="name">${esc(a.name)}</span>${a.running?'':'<span class="sleepdot" aria-hidden="true"></span>'}</label>`).join('')}</div>`:'<div class="empty">표시할 앱이 없어요</div>'}</div><div class="gridnote"><span>${state.excluded?'저장하지 않는 앱':chosen().length+'개 앱 선택됨'}</span><span>• 실행하지 않은 앱</span></div></div>${notice()}${last()}${footer()}`}
function url(){const q=new URLSearchParams({variant:state.variant,theme:state.theme,apps:state.amount,state:state.scenario});if(state.compare)q.set('view','compare');else if(query.get('view')==='card')q.set('view','card');history.replaceState(null,'','?'+q)}
function card(v){return `<section class="card ${v} ${state.theme} ${state.scenario==='offline'?'offline':''}" data-variant="${v}" aria-label="${v} ${descriptions[v].name}">${contents(v)}</section>`}
function render(){const focused=document.activeElement;const searchKey=focused?.dataset.search;const selection=searchKey?[focused.selectionStart,focused.selectionEnd]:null;const scrolls=[...document.querySelectorAll('.card')].map(c=>[c.dataset.variant,c.querySelector('.scroll')?.scrollTop||0]);const d=descriptions[state.variant];document.getElementById('main').innerHTML=state.compare?`<div class="compare">${[...'ABCD'].map(v=>`<div class="stage"><div class="caption">${v} · ${descriptions[v].name}<span>${descriptions[v].short}</span></div>${card(v)}</div>`).join('')}</div>`:`<div class="single"><aside class="notes"><div class="letter">${state.variant}</div><h2>${d.name}</h2><p>${d.body}</p><dl><dt>잘 맞는 사용 방식</dt><dd>${d.fit}</dd><dt>선택할 때 생각할 점</dt><dd>${d.trade}</dd></dl></aside><div class="stage">${card(state.variant)}<div class="measure">폭 ${{A:360,B:364,C:440,D:400}[state.variant]} px · 실제 메뉴바 크기 기준</div></div></div>`;document.querySelector('.switcher').innerHTML=`<button class="arrow" data-step="-1" aria-label="이전 시안">←</button>${[...'ABCD'].map(v=>`<button data-variant-pick="${v}" class="${!state.compare&&state.variant===v?'active':''}" aria-pressed="${!state.compare&&state.variant===v}">${v}</button>`).join('')}<button class="arrow" data-step="1" aria-label="다음 시안">→</button>`;document.getElementById('amount').value=state.amount;document.getElementById('theme').value=state.theme;document.getElementById('scenario').value=state.scenario;document.getElementById('compare').textContent=state.compare?'하나씩 보기':'네 시안 비교';for(const [v,y]of scrolls){const s=document.querySelector(`.card[data-variant="${v}"] .scroll`);if(s)s.scrollTop=y}if(searchKey){const input=document.querySelector(`[data-search="${searchKey}"]`);input?.focus();if(input&&selection)input.setSelectionRange(...selection)}document.querySelector('.feedback').textContent=state.message;url()}
let feedbackTimer;function tell(message){state.message=message;render();clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>{state.message='';document.querySelector('.feedback').textContent=''},3800)}
function step(n){state.variant='ABCD'[('ABCD'.indexOf(state.variant)+n+4)%4];state.compare=false;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.variantPick){state.variant=b.dataset.variantPick;state.compare=false;render()}else if(b.dataset.step)step(Number(b.dataset.step));else if(b.id==='compare'){state.compare=!state.compare;render()}else if(b.dataset.space){state.space=b.dataset.space==='excluded'?'excluded':Number(b.dataset.space);render()}else if(b.dataset.remove){const a=[...apps,...extras].find(a=>a.id===b.dataset.remove);a.stored=false;if(!a.running)state.removed.add(a.id);tell(a.name+'의 저장 기록을 삭제했어요. (시안)')}else{const action=b.dataset.action;if(action==='manage'||action==='back'){state.manager=action==='manage';render()}if(action==='filter'){state.excluded=!state.excluded;render()}if(action==='restore')tell(chosen().length+'개 대상 앱을 저장된 배치로 복원했어요. (시안)');if(action==='save'){state.scenario='ready';tell('현재 배치를 저장했어요. (시안)')}if(action==='details')tell(state.scenario==='failure'?'예시: 5개 이동 · Xcode 1개 실패':'직전 복원 예시: 2개 이동 · 6개는 위치가 같거나 실행 중이 아니어서 건너뜀');if(action==='settings')tell('시안에서는 자동 복원과 앱 선택을 직접 바꿔볼 수 있어요.');if(action==='quit')tell('프로토타입입니다. 실제 Plugback은 종료하지 않습니다.')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.app){t.checked?state.enabled.add(t.dataset.app):state.enabled.delete(t.dataset.app);if(!t.checked)state.expanded.add(t.closest('.card').dataset.variant);tell((t.checked?'복원 대상에 포함했어요.':'복원 대상에서 제외했어요.')+' (시안)')}else if(t.hasAttribute('data-auto')){state.auto=t.checked;tell('자동 복원 '+(state.auto?'켜짐':'꺼짐')+' (시안)')}else if(t.id==='amount'){state.amount=Number(t.value);render()}else if(t.id==='theme'){state.theme=t.value;render()}else if(t.id==='scenario'){state.scenario=t.value;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.search){state.search[e.target.dataset.search]=e.target.value;render()}});
document.addEventListener('toggle',e=>{if(e.target.dataset.excluded){e.target.open?state.expanded.add(e.target.dataset.excluded):state.expanded.delete(e.target.dataset.excluded)}},true);
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,button,summary,textarea'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();step(e.key==='ArrowRight'?1:-1)}});
// Standalone smoke check: open with ?check=1; no app data or external services are used.
if(query.has('check')){console.assert(visible().length===state.amount,'app count');console.assert(new Set(apps.map(a=>a.id)).size===20,'unique IDs');const before=chosen().length;state.enabled.delete('app-0');console.assert(chosen().length===before-1&&omitted().some(a=>a.id==='app-0'),'selection moves to excluded');state.enabled.add('app-0');for(const v of 'ABCD')console.assert(contents(v).includes('data-action="restore"'),'restore action '+v)}
if(query.get('view')==='card')document.body.classList.add('cardonly');render();
</script>
</html>
